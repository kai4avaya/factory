<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echochrome Machine Assembly</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            background-color: #ffffff; /* Pure white background */
            font-family: 'Courier New', Courier, monospace;
            user-select: none; /* Prevent text selection while dragging */
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            z-index: 1;
        }

        #scroll-track {
            height: 600vh; /* Long scroll area to control animation speed */
            position: relative;
            z-index: 0;
        }

        #ui-layer {
            position: fixed;
            bottom: 30px;
            left: 30px;
            z-index: 2;
            color: #000;
            background: rgba(255, 255, 255, 0.95);
            padding: 15px;
            border: 1px solid #000;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.1);
        }

        /* Recorder UI Container */
        #recorder-ui {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 2;
            display: none; /* Hidden until audio starts */
            text-align: center;
            background: rgba(255,255,255,0.8);
            padding: 10px;
            border-radius: 8px;
        }

        #spiral-container {
            width: 100px;
            height: 100px;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.1s;
            margin: 0 auto;
        }

        #spiral-container:active {
            transform: scale(0.9);
            opacity: 0.5;
        }

        #recorder-controls {
            margin-top: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 10px;
            color: #666;
            font-family: 'Courier New', Courier, monospace;
        }

        #download-hint {
            cursor: pointer;
            /* text-decoration removed */
        }

        #reset-recording-btn {
            display: inline-block; /* Override global button display:none */
            background: transparent;
            border: 1px solid #999;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            line-height: 16px;
            text-align: center;
            padding: 0;
            font-size: 12px;
            cursor: pointer;
            color: #666;
            margin: 0;
        }

        #reset-recording-btn:hover {
            background: #eee;
            color: #000;
            border-color: #000;
        }

        h1 {
            font-size: 14px;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        p {
            font-size: 12px;
            margin: 0;
        }

        .instruction {
            font-size: 10px;
            color: #666;
            margin-top: 8px;
            font-style: italic;
        }

        /* Global button style for Mute button */
        #mute-btn {
            background: transparent;
            border: 1px solid black;
            font-family: 'Courier New', Courier, monospace;
            font-size: 10px;
            padding: 4px 8px;
            margin-top: 10px;
            cursor: pointer;
            text-transform: uppercase;
            display: none; 
        }

        #mute-btn:hover {
            background: #eee;
        }
        
        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: black;
            font-size: 20px;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="loading" id="loading">GENERATING PARTS...</div>

    <div id="ui-layer">
        <h1>Project: Clockwork</h1>
        <p>Scroll to Assemble</p>
        <p class="instruction" id="audio-status">[Click anywhere to start Audio]</p>
        <p class="instruction" id="drag-hint" style="display:none; color:#000;">[Click & Drag to Improvise]</p>
        <button id="mute-btn">Sound: ON</button>
    </div>

    <!-- Recorder UI -->
    <div id="recorder-ui">
        <div id="spiral-container" title="Click to Download">
            <canvas id="spiral-canvas" width="100" height="100"></canvas>
        </div>
        <div id="recorder-controls">
            <span id="download-hint">Click spiral to download rhythm</span>
            <button id="reset-recording-btn" title="Reset (No Download)">↻</button>
        </div>
    </div>

    <div id="canvas-container"></div>
    <div id="scroll-track"></div>

    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- Configuration ---
        const CONFIG = {
            bgColor: 0xffffff,
            lineColor: 0x000000, 
            faceColor: 0xffffff, 
            scatterRadius: 80, 
            scrollSensitivity: 0.05, 
            orthoSize: 25, 
            bpm: 100 // Slower, more relaxed BPM
        };

        // --- Global Variables ---
        let scene, camera, renderer;
        let machineGroup, birdGroup, bgGroup;
        let parts = []; 
        let birds = []; 
        let cratePiles = []; // Background objects
        let scrollPercent = 0;
        let smoothScroll = 0;
        let isAssembled = false;

        // --- Interaction Globals ---
        let isDragging = false;
        let activeNotes = []; // Array for interactive shapes
        let mouse = new THREE.Vector2();
        let raycaster = new THREE.Raycaster();
        let lastSpawnPos = new THREE.Vector2();

        // --- Audio Context ---
        let audioCtx;
        let masterGain; // Global master for recording
        let nextNoteTime = 0;
        let beatCount = 0;
        let isAudioInit = false; 
        let isMuted = false;
        let isResting = false; // State for musical pauses

        // --- Recorder & Spiral Globals ---
        let mediaRecorder;
        let audioChunks = [];
        let sessionNoteCount = 0;
        let shouldDownload = false; // Flag to control download vs reset
        const spiralCanvas = document.getElementById('spiral-canvas');
        const spiralCtx = spiralCanvas.getContext('2d');

        // --- Materials ---
        const materialFace = new THREE.MeshBasicMaterial({ 
            color: CONFIG.faceColor,
            polygonOffset: true,
            polygonOffsetFactor: 1, 
            polygonOffsetUnits: 1
        });
        
        const materialLine = new THREE.LineBasicMaterial({ 
            color: CONFIG.lineColor, 
            linewidth: 1.5 
        });

        // --- Initialization ---
        function init() {
            const container = document.getElementById('canvas-container');

            // 1. Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(CONFIG.bgColor);
            scene.fog = new THREE.Fog(CONFIG.bgColor, 40, 110); 

            // 2. Camera
            const aspect = window.innerWidth / window.innerHeight;
            camera = new THREE.OrthographicCamera(
                -CONFIG.orthoSize * aspect, CONFIG.orthoSize * aspect,
                CONFIG.orthoSize, -CONFIG.orthoSize,
                0.1, 1000
            );
            camera.position.set(40, 30, 40);
            camera.lookAt(0, 0, 0);

            // 3. Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            // 4. Groups
            bgGroup = new THREE.Group();
            machineGroup = new THREE.Group();
            birdGroup = new THREE.Group();
            
            scene.add(bgGroup); 
            scene.add(machineGroup);
            scene.add(birdGroup);

            // 5. Build Content
            buildMachine();
            createBirds();
            initBackgroundCrates();

            document.getElementById('loading').style.display = 'none';

            // 6. Events
            window.addEventListener('resize', onWindowResize);
            window.addEventListener('scroll', onScroll);
            
            // Audio init
            window.addEventListener('click', initAudio);
            window.addEventListener('touchstart', initAudio);

            // Interaction Listeners
            document.addEventListener('mousedown', onMouseDown);
            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('mouseup', onMouseUp);

            // UI Listeners
            document.getElementById('mute-btn').addEventListener('click', toggleMute);
            document.getElementById('spiral-container').addEventListener('click', triggerDownload);
            document.getElementById('download-hint').addEventListener('click', triggerDownload);
            document.getElementById('reset-recording-btn').addEventListener('click', triggerReset);

            // 7. Start Loop
            animate();
            drawSpiral(); // Init draw
        }

        // --- Recorder & Spiral Logic ---
        function drawSpiral() {
            const ctx = spiralCtx;
            const w = spiralCanvas.width;
            const h = spiralCanvas.height;
            const cx = w / 2;
            const cy = h / 2;
            
            ctx.clearRect(0, 0, w, h);
            ctx.beginPath();
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 1.5;
            ctx.lineCap = 'square';

            // Spiral parameters
            let x = cx;
            let y = cy;
            let step = 5; // Gap
            
            // Limit determines length of the spiral line
            let limit = 2 + (sessionNoteCount * 1); 
            if(limit > 300) limit = 300;

            let count = 0;
            let legLength = step;
            let dir = 0; // 0:R, 1:D, 2:L, 3:U

            ctx.moveTo(x, y);

            // Draw spiral segments
            while (count < limit) {
                for (let i = 0; i < 2; i++) {
                    // Update position based on direction
                    if (dir === 0) x += legLength;
                    else if (dir === 1) y += legLength;
                    else if (dir === 2) x -= legLength;
                    else if (dir === 3) y -= legLength;
                    
                    ctx.lineTo(x, y);
                    dir = (dir + 1) % 4;
                    count++;
                    if(count >= limit) break;
                }
                legLength += step;
            }
            ctx.stroke();
        }

        function triggerDownload(e) {
            e.stopPropagation(); 
            if (!mediaRecorder || sessionNoteCount === 0) return;
            shouldDownload = true;
            mediaRecorder.stop();
        }

        function triggerReset(e) {
            e.stopPropagation();
            if (!mediaRecorder) return;
            shouldDownload = false;
            mediaRecorder.stop();
        }

        // --- Interaction Logic ---
        function onMouseDown(e) {
            if (!isAssembled) return; 
            // Don't spawn if clicking spiral UI
            if (e.target.closest('#recorder-ui')) return;

            isDragging = true;
            spawnNoteAtMouse(e);
        }

        function onMouseUp() {
            isDragging = false;
        }

        function onMouseMove(e) {
            if (!isDragging || !isAssembled) return;
            
            // Rate limit spawning based on pixel distance
            const dx = e.clientX - lastSpawnPos.x;
            const dy = e.clientY - lastSpawnPos.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            
            if (dist > 40) { // Spawn every 40px
                spawnNoteAtMouse(e);
            }
        }

        function spawnNoteAtMouse(e) {
            lastSpawnPos.set(e.clientX, e.clientY);
            
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            
            const target = new THREE.Vector3();
            raycaster.ray.at(50, target); 

            createInteractiveShape(target);
            
            // Update Spiral Data
            sessionNoteCount++;
            drawSpiral();
        }

        function createInteractiveShape(pos) {
            const type = Math.floor(Math.random() * 3);
            let geo;
            if (type === 0) geo = new THREE.BoxGeometry(1.5, 1.5, 1.5);
            else if (type === 1) geo = new THREE.OctahedronGeometry(1);
            else geo = new THREE.TetrahedronGeometry(1.2);

            const mesh = new THREE.Mesh(geo, materialFace);
            const edges = new THREE.EdgesGeometry(geo);
            const line = new THREE.LineSegments(edges, materialLine);
            mesh.add(line);
            
            mesh.position.copy(pos);
            mesh.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, 0);
            
            scene.add(mesh);

            const baseFreqs = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25];
            const freq = baseFreqs[Math.floor(Math.random() * baseFreqs.length)] * (Math.random() > 0.7 ? 2 : 1);
            
            activeNotes.push({
                mesh: mesh,
                life: 1.0, 
                decay: 0.005 + Math.random() * 0.005, 
                freq: freq,
                pulseInterval: 0.2 + Math.random() * 0.4, 
                lastPulse: 0,
                drift: new THREE.Vector3((Math.random()-0.5)*0.1, 0.05 + Math.random()*0.1, (Math.random()-0.5)*0.1)
            });
            
            if (isAudioInit && !isMuted) {
                playSound(freq, 'triangle', 0.1, 0.1);
            }
        }

        function updateInteractiveShapes() {
            const now = audioCtx ? audioCtx.currentTime : 0;
            
            for (let i = activeNotes.length - 1; i >= 0; i--) {
                const note = activeNotes[i];
                
                note.life -= note.decay;
                note.mesh.position.add(note.drift);
                note.mesh.rotation.x += 0.02;
                note.mesh.rotation.y += 0.02;
                
                const s = note.life;
                note.mesh.scale.set(s, s, s);

                if (isAudioInit && !isMuted && audioCtx) {
                     if (now - note.lastPulse > note.pulseInterval) {
                         playSound(note.freq, 'sine', 0.05, 0.05 * note.life);
                         note.lastPulse = now;
                     }
                }

                if (note.life <= 0) {
                    scene.remove(note.mesh);
                    note.mesh.geometry.dispose();
                    activeNotes.splice(i, 1);
                }
            }
        }

        // --- Audio System ---
        function initAudio() {
            if (isAudioInit) return;
            
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
            audioCtx.resume();
            
            masterGain = audioCtx.createGain();
            masterGain.connect(audioCtx.destination);
            
            const dest = audioCtx.createMediaStreamDestination();
            masterGain.connect(dest);
            
            try {
                mediaRecorder = new MediaRecorder(dest.stream);
                mediaRecorder.ondataavailable = e => {
                    if (e.data.size > 0) audioChunks.push(e.data);
                };
                mediaRecorder.onstop = () => {
                    if (shouldDownload && sessionNoteCount > 0) {
                        const blob = new Blob(audioChunks, { type: 'audio/webm' });
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.style.display = 'none';
                        a.href = url;
                        a.download = 'echochrome-session.webm';
                        document.body.appendChild(a);
                        a.click();
                        setTimeout(() => {
                            document.body.removeChild(a);
                            window.URL.revokeObjectURL(url);
                        }, 100);
                    }
                    
                    // Always Reset
                    audioChunks = [];
                    sessionNoteCount = 0;
                    shouldDownload = false;
                    drawSpiral();
                    mediaRecorder.start(); 
                };
                mediaRecorder.start();
            } catch (e) {
                console.error("MediaRecorder not supported or failed", e);
            }

            isAudioInit = true;
            nextNoteTime = audioCtx.currentTime + 0.1;
            
            window.removeEventListener('click', initAudio);
            window.removeEventListener('touchstart', initAudio);
            
            document.getElementById('audio-status').style.display = 'none'; 
            document.getElementById('mute-btn').style.display = 'block'; 
            document.getElementById('recorder-ui').style.display = 'block';
        }

        function toggleMute(e) {
            e.stopPropagation(); 
            isMuted = !isMuted;
            const btn = document.getElementById('mute-btn');
            
            if (isMuted) {
                if(audioCtx) audioCtx.suspend();
                btn.textContent = "Sound: OFF";
            } else {
                if(audioCtx) audioCtx.resume();
                btn.textContent = "Sound: ON";
            }
        }

        function playSound(freq, type, duration, vol) {
            if (!isAudioInit || isMuted || !audioCtx) return;
            
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            
            const now = audioCtx.currentTime;
            gainNode.gain.setValueAtTime(0, now);
            gainNode.gain.linearRampToValueAtTime(vol, now + 0.05); 
            gainNode.gain.exponentialRampToValueAtTime(0.001, now + duration); 
            
            osc.connect(gainNode);
            gainNode.connect(masterGain); 
            
            osc.start();
            osc.stop(now + duration + 0.1);
        }

        function scheduleAudio() {
            if (!isAudioInit || isMuted || !isAssembled) return;

            const secondsPerBeat = 60.0 / CONFIG.bpm;
            const lookahead = 0.1; 

            while (nextNoteTime < audioCtx.currentTime + lookahead) {
                
                if (beatCount % 16 === 0) {
                    isResting = Math.random() < 0.3;
                }

                if (!isResting) {
                    if (beatCount % 2 === 0) {
                        playSound(55, 'sine', 0.8, 0.3); 
                    } else {
                        playSound(110, 'sine', 0.4, 0.15); 
                    }

                    if (beatCount % 4 === 0) {
                        playSound(440, 'sine', 1.5, 0.05); 
                    }
                } else {
                    if (beatCount % 8 === 0) {
                        playSound(880, 'sine', 0.1, 0.02);
                    }
                }

                nextNoteTime += secondsPerBeat;
                beatCount++;
            }
        }

        // --- Geometry Builders ---
        function createStyledMesh(geometry, finalPos, finalRot, parentGroup) {
            const mesh = new THREE.Mesh(geometry, materialFace);
            const edges = new THREE.EdgesGeometry(geometry, 15);
            const line = new THREE.LineSegments(edges, materialLine);
            mesh.add(line);

            if(finalPos) mesh.position.copy(finalPos);
            if(finalRot) mesh.rotation.set(finalRot.x, finalRot.y, finalRot.z);

            if(parentGroup) parentGroup.add(mesh);
            return mesh;
        }

        function createAssemblyPart(geometry, finalPos, finalRot, parentGroup) {
            const mesh = createStyledMesh(geometry, finalPos, finalRot, parentGroup);

            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos((Math.random() * 2) - 1);
            const r = 30 + Math.random() * CONFIG.scatterRadius;
            
            const startPos = new THREE.Vector3(
                r * Math.sin(phi) * Math.cos(theta),
                r * Math.sin(phi) * Math.sin(theta),
                r * Math.cos(phi)
            );

            const startRot = new THREE.Euler(
                Math.random() * Math.PI * 2,
                Math.random() * Math.PI * 2,
                Math.random() * Math.PI * 2
            );

            const partData = {
                mesh: mesh,
                startPos: startPos,
                destPos: finalPos.clone(),
                startRot: startRot,
                destRot: finalRot.clone(),
                speedOffset: 0.8 + Math.random() * 0.4, 
                delay: Math.random() * 0.2
            };

            parts.push(partData);
            return mesh;
        }

        function createGear(radius, width, teeth) {
            const gearGroup = new THREE.Group();
            
            const disc = new THREE.CylinderGeometry(radius, radius, width, 24);
            createAssemblyPart(disc, new THREE.Vector3(0,0,0), new THREE.Euler(0,0,0), gearGroup);
            
            const toothGeo = new THREE.BoxGeometry(width * 0.6, width, radius * 0.4);
            for(let i=0; i<teeth; i++) {
                const angle = (i / teeth) * Math.PI * 2;
                const tx = Math.cos(angle) * (radius);
                const tz = Math.sin(angle) * (radius);
                
                const pos = new THREE.Vector3(tx, 0, tz);
                const rot = new THREE.Euler(0, -angle, 0);
                createAssemblyPart(toothGeo, pos, rot, gearGroup);
            }
            return gearGroup;
        }

        // --- Background Crates Logic ---
        function initBackgroundCrates() {
            for(let i=0; i<8; i++) {
                createCratePile();
            }
        }

        function createCratePile() {
            const pileGroup = new THREE.Group();
            const boxGeo = new THREE.BoxGeometry(4, 4, 4);
            const boxes = [];

            const numBoxes = 3 + Math.floor(Math.random() * 5); 
            
            for(let j=0; j<numBoxes; j++) {
                const x = (Math.random() - 0.5) * 1.5; 
                const z = (Math.random() - 0.5) * 1.5;
                const y = j * 4; 
                
                const mesh = createStyledMesh(boxGeo, new THREE.Vector3(x,y,z), new THREE.Euler(0, Math.random()*0.5, 0), pileGroup);
                
                mesh.scale.set(0,0,0);
                
                boxes.push({
                    mesh: mesh,
                    active: false,
                    scale: 0
                });
            }
            
            bgGroup.add(pileGroup);
            setRandomPilePosition(pileGroup);

            cratePiles.push({
                group: pileGroup,
                boxes: boxes,
                state: 'waiting', 
                timer: Math.random() * 300,
                stepTimer: 0,
                currentBoxIndex: 0
            });
        }

        function setRandomPilePosition(group) {
            const angle = Math.random() * Math.PI * 2;
            const dist = 60 + Math.random() * 40; 
            const y = -20 + Math.random() * 40;
            
            group.position.set(
                Math.cos(angle) * dist, 
                y, 
                Math.sin(angle) * dist
            );
            group.rotation.y = Math.random() * Math.PI;
        }

        function updateBackground() {
            cratePiles.forEach(pile => {
                
                if (pile.state === 'waiting') {
                    pile.timer--;
                    if (pile.timer <= 0) {
                        pile.state = 'building';
                        setRandomPilePosition(pile.group);
                        
                        pile.boxes.forEach(b => { b.active = false; b.scale = 0; });
                        pile.currentBoxIndex = 0;
                        pile.stepTimer = 0;
                    }
                } 
                else if (pile.state === 'building') {
                    pile.stepTimer--;
                    if (pile.stepTimer <= 0) {
                        if (pile.currentBoxIndex < pile.boxes.length) {
                            pile.boxes[pile.currentBoxIndex].active = true;
                            pile.currentBoxIndex++;
                            pile.stepTimer = 10 + Math.random() * 20; 
                        } else {
                            pile.state = 'full';
                            pile.timer = 150 + Math.random() * 200; 
                        }
                    }
                }
                else if (pile.state === 'full') {
                    pile.timer--;
                    if (pile.timer <= 0) {
                        pile.state = 'collapsing';
                        pile.stepTimer = 0;
                    }
                }
                else if (pile.state === 'collapsing') {
                    pile.stepTimer--;
                    if (pile.stepTimer <= 0) {
                        const activeList = pile.boxes.filter(b => b.active);
                        if (activeList.length > 0) {
                            const r = Math.floor(Math.random() * activeList.length);
                            activeList[r].active = false;
                            pile.stepTimer = 10 + Math.random() * 20;
                        } else {
                            pile.state = 'waiting';
                            pile.timer = 60 + Math.random() * 200;
                        }
                    }
                }

                pile.boxes.forEach(b => {
                    const target = b.active ? 1 : 0;
                    b.scale += (target - b.scale) * 0.1;
                    if(Math.abs(target - b.scale) < 0.01) b.scale = target;
                    b.mesh.scale.set(b.scale, b.scale, b.scale);
                });
            });
        }

        // --- Bird System ---
        function createBirds() {
            const birdGeo = new THREE.ConeGeometry(0.3, 1.0, 4); 
            birdGeo.rotateX(Math.PI / 2); 

            for (let i = 0; i < 6; i++) {
                const mesh = createStyledMesh(birdGeo, null, null, birdGroup);
                
                const direction = Math.random() > 0.5 ? 1 : -1;

                birds.push({
                    mesh: mesh,
                    angle: (i / 6) * Math.PI * 2, 
                    speed: (0.005 + Math.random() * 0.008) * direction, 
                    heightY: 5 + (Math.random() * 20),
                    radiusOffset: Math.random() * 5,
                    direction: direction
                });
            }
        }

        function updateBirds() {
            const baseRadius = 15;
            const scatterRadius = 80;
            const currentRadiusBase = scatterRadius - ((scatterRadius - baseRadius) * smoothScroll);

            birds.forEach(b => {
                b.angle += b.speed;
                const r = currentRadiusBase + b.radiusOffset;
                const x = Math.cos(b.angle) * r;
                const z = Math.sin(b.angle) * r;
                const y = b.heightY + Math.sin(b.angle * 3) * 2; 

                b.mesh.position.set(x, y, z);
                
                let facingRot = -b.angle;
                if (b.direction < 0) facingRot += Math.PI;

                b.mesh.rotation.y = facingRot;
                b.mesh.rotation.z = b.direction * -0.2; 
            });
        }

        // --- Machine Logic ---
        function buildMachine() {
            const axleGeo = new THREE.CylinderGeometry(0.5, 0.5, 30, 12);
            const mainAxle = new THREE.Group();
            createAssemblyPart(axleGeo, new THREE.Vector3(0,0,0), new THREE.Euler(0,0,Math.PI/2), mainAxle);
            machineGroup.add(mainAxle);

            const gear1 = createGear(5, 1, 12);
            gear1.position.set(-8, 0, 0);
            gear1.rotation.x = Math.PI / 2;
            gear1.userData.spinAxis = 'x';
            gear1.userData.spinSpeed = 0.01;
            machineGroup.add(gear1);

            const gear2 = createGear(2.5, 2, 8);
            gear2.position.set(-4, 0, 0);
            gear2.rotation.x = Math.PI / 2;
            gear2.userData.spinAxis = 'x';
            gear2.userData.spinSpeed = 0.01;
            machineGroup.add(gear2);

            const gear3 = createGear(7, 0.5, 24);
            gear3.position.set(0, 0, 0);
            gear3.rotation.x = Math.PI / 2;
            gear3.userData.spinAxis = 'x';
            gear3.userData.spinSpeed = 0.01;
            machineGroup.add(gear3);

            const vertAxle = new THREE.Group();
            machineGroup.add(vertAxle);
            createAssemblyPart(new THREE.CylinderGeometry(0.4, 0.4, 15, 8), new THREE.Vector3(5, 5, 0), new THREE.Euler(0,0,0), vertAxle);

            const gear4 = createGear(5, 1, 16);
            gear4.position.set(5, 0, 0); 
            gear4.rotation.z = 0.2;
            gear4.userData.spinAxis = 'y';
            gear4.userData.spinSpeed = -0.015;
            machineGroup.add(gear4);

            const gear5 = createGear(3, 3, 10);
            gear5.position.set(5, 10, 0);
            gear5.userData.spinAxis = 'y';
            gear5.userData.spinSpeed = -0.015;
            machineGroup.add(gear5);

            const frameGeo = new THREE.BoxGeometry(1, 20, 1);
            const beamGeo = new THREE.BoxGeometry(20, 1, 1);
            const frameGroup = new THREE.Group();
            machineGroup.add(frameGroup);

            createAssemblyPart(frameGeo, new THREE.Vector3(-12, 0, -8), new THREE.Euler(0,0,0), frameGroup);
            createAssemblyPart(frameGeo, new THREE.Vector3(12, 0, -8), new THREE.Euler(0,0,0), frameGroup);
            createAssemblyPart(frameGeo, new THREE.Vector3(-12, 0, 8), new THREE.Euler(0,0,0), frameGroup);
            createAssemblyPart(frameGeo, new THREE.Vector3(12, 0, 8), new THREE.Euler(0,0,0), frameGroup);

            createAssemblyPart(beamGeo, new THREE.Vector3(0, 10, -8), new THREE.Euler(0,0,0), frameGroup);
            createAssemblyPart(beamGeo, new THREE.Vector3(0, -10, -8), new THREE.Euler(0,0,0), frameGroup);
            createAssemblyPart(beamGeo, new THREE.Vector3(0, 10, 8), new THREE.Euler(0,0,0), frameGroup);
            
            const zBeamGeo = new THREE.BoxGeometry(1, 1, 16);
            createAssemblyPart(zBeamGeo, new THREE.Vector3(-12, 10, 0), new THREE.Euler(0,0,0), frameGroup);
            createAssemblyPart(zBeamGeo, new THREE.Vector3(12, 10, 0), new THREE.Euler(0,0,0), frameGroup);

            const nutGeo = new THREE.CylinderGeometry(0.3, 0.3, 0.2, 6);
            for(let i=0; i<30; i++) {
                const pos = new THREE.Vector3(
                    (Math.random()-0.5)*20,
                    (Math.random()-0.5)*20,
                    (Math.random()-0.5)*10
                );
                createAssemblyPart(nutGeo, pos, new THREE.Euler(Math.random(), Math.random(), 0), machineGroup);
            }
        }

        // --- Interaction ---
        function onScroll() {
            const h = document.documentElement.scrollHeight - window.innerHeight;
            const t = window.scrollY / h;
            scrollPercent = Math.max(0, Math.min(1, t));
        }

        function onWindowResize() {
            const aspect = window.innerWidth / window.innerHeight;
            camera.left = -CONFIG.orthoSize * aspect;
            camera.right = CONFIG.orthoSize * aspect;
            camera.top = CONFIG.orthoSize;
            camera.bottom = -CONFIG.orthoSize;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- Animation Loop ---
        function animate() {
            requestAnimationFrame(animate);

            smoothScroll += (scrollPercent - smoothScroll) * CONFIG.scrollSensitivity;
            isAssembled = smoothScroll > 0.99;
            
            if (isAssembled) {
                document.getElementById('drag-hint').style.display = 'block';
            } else {
                document.getElementById('drag-hint').style.display = 'none';
            }

            scheduleAudio();

            parts.forEach(p => {
                let progress = (smoothScroll - p.delay) * (1 / (1 - p.delay));
                progress = Math.max(0, Math.min(1, progress));
                const ease = 1 - Math.pow(1 - progress, 3);
                p.mesh.position.lerpVectors(p.startPos, p.destPos, ease);
                p.mesh.rotation.x = p.startRot.x + (p.destRot.x - p.startRot.x) * ease;
                p.mesh.rotation.y = p.startRot.y + (p.destRot.y - p.startRot.y) * ease;
                p.mesh.rotation.z = p.startRot.z + (p.destRot.z - p.startRot.z) * ease;
            });

            updateBirds();
            updateBackground(); 
            updateInteractiveShapes(); 

            if (isAssembled) {
                machineGroup.traverse((obj) => {
                    if (obj.userData && obj.userData.spinSpeed) {
                        const axis = obj.userData.spinAxis || 'x';
                        obj.rotation[axis] += obj.userData.spinSpeed;
                    }
                });
            }

            const time = Date.now() * 0.0005;
            camera.position.x = 40 + Math.sin(time) * 2;
            camera.position.z = 40 + Math.cos(time) * 2;
            camera.lookAt(0,0,0);

            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
