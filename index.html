<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echochrome Machine Assembly</title>
<link rel="icon" href="square.ico" typee="image/x-icon">
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            background-color: #ffffff; /* Pure white background */
            font-family: 'Courier New', Courier, monospace;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            z-index: 1;
        }

        #scroll-track {
            height: 600vh; /* Long scroll area to control animation speed */
            position: relative;
            z-index: 0;
        }

        #ui-layer {
            position: fixed;
            bottom: 30px;
            left: 30px;
            z-index: 2;
            color: #000;
            background: rgba(255, 255, 255, 0.95);
            padding: 15px;
            border: 1px solid #000;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.1);
        }

        h1 {
            font-size: 14px;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        p {
            font-size: 12px;
            margin: 0;
        }

        .instruction {
            font-size: 10px;
            color: #666;
            margin-top: 8px;
            font-style: italic;
        }

        button {
            background: transparent;
            border: 1px solid black;
            font-family: 'Courier New', Courier, monospace;
            font-size: 10px;
            padding: 4px 8px;
            margin-top: 10px;
            cursor: pointer;
            text-transform: uppercase;
            display: none; /* Hidden until audio starts */
        }

        button:hover {
            background: #eee;
        }
        
        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: black;
            font-size: 20px;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="loading" id="loading">GENERATING PARTS...</div>

    <div id="ui-layer">
        <h1>Project: Clockwork</h1>
        <p>Scroll to Assemble</p>
        <p class="instruction" id="audio-status">[Click anywhere to start Audio]</p>
        <button id="mute-btn">Sound: ON</button>
    </div>

    <div id="canvas-container"></div>
    <div id="scroll-track"></div>

    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- Configuration ---
        const CONFIG = {
            bgColor: 0xffffff,
            lineColor: 0x000000, 
            faceColor: 0xffffff, 
            scatterRadius: 80, 
            scrollSensitivity: 0.05, 
            orthoSize: 25, 
            bpm: 100 // Slower, more relaxed BPM
        };

        // --- Global Variables ---
        let scene, camera, renderer;
        let machineGroup, birdGroup, bgGroup;
        let parts = []; 
        let birds = []; 
        let cratePiles = []; // Background objects
        let scrollPercent = 0;
        let smoothScroll = 0;
        let isAssembled = false;

        // --- Audio Context ---
        let audioCtx;
        let nextNoteTime = 0;
        let beatCount = 0;
        let isAudioInit = false; 
        let isMuted = false;
        let isResting = false; // State for musical pauses

        // --- Materials ---
        const materialFace = new THREE.MeshBasicMaterial({ 
            color: CONFIG.faceColor,
            polygonOffset: true,
            polygonOffsetFactor: 1, 
            polygonOffsetUnits: 1
        });
        
        const materialLine = new THREE.LineBasicMaterial({ 
            color: CONFIG.lineColor, 
            linewidth: 1.5 
        });

        // --- Initialization ---
        function init() {
            const container = document.getElementById('canvas-container');

            // 1. Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(CONFIG.bgColor);
            scene.fog = new THREE.Fog(CONFIG.bgColor, 40, 110); // Increased fog distance for background crates

            // 2. Camera
            const aspect = window.innerWidth / window.innerHeight;
            camera = new THREE.OrthographicCamera(
                -CONFIG.orthoSize * aspect, CONFIG.orthoSize * aspect,
                CONFIG.orthoSize, -CONFIG.orthoSize,
                0.1, 1000
            );
            camera.position.set(40, 30, 40);
            camera.lookAt(0, 0, 0);

            // 3. Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            // 4. Groups
            bgGroup = new THREE.Group();
            machineGroup = new THREE.Group();
            birdGroup = new THREE.Group();
            
            scene.add(bgGroup); // Add background first
            scene.add(machineGroup);
            scene.add(birdGroup);

            // 5. Build Content
            buildMachine();
            createBirds();
            initBackgroundCrates();

            document.getElementById('loading').style.display = 'none';

            // 6. Events
            window.addEventListener('resize', onWindowResize);
            window.addEventListener('scroll', onScroll);
            
            // Audio init on interaction
            window.addEventListener('click', initAudio);
            window.addEventListener('touchstart', initAudio);

            // Mute Button
            document.getElementById('mute-btn').addEventListener('click', toggleMute);

            // 7. Start Loop
            animate();
        }

        // --- Audio System ---
        function initAudio() {
            if (isAudioInit) return;
            
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
            audioCtx.resume();
            
            isAudioInit = true;
            nextNoteTime = audioCtx.currentTime + 0.1;
            
            window.removeEventListener('click', initAudio);
            window.removeEventListener('touchstart', initAudio);
            
            document.getElementById('audio-status').style.display = 'none'; 
            document.getElementById('mute-btn').style.display = 'block'; 
        }

        function toggleMute(e) {
            e.stopPropagation(); 
            isMuted = !isMuted;
            const btn = document.getElementById('mute-btn');
            
            if (isMuted) {
                if(audioCtx) audioCtx.suspend();
                btn.textContent = "Sound: OFF";
            } else {
                if(audioCtx) audioCtx.resume();
                btn.textContent = "Sound: ON";
            }
        }

        function playSound(freq, type, duration, vol) {
            if (!isAudioInit || isMuted || !audioCtx) return;
            
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            
            const now = audioCtx.currentTime;
            gainNode.gain.setValueAtTime(0, now);
            gainNode.gain.linearRampToValueAtTime(vol, now + 0.05); 
            gainNode.gain.exponentialRampToValueAtTime(0.001, now + duration); 
            
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(now + duration + 0.1);
        }

        function scheduleAudio() {
            if (!isAudioInit || isMuted || !isAssembled) return;

            const secondsPerBeat = 60.0 / CONFIG.bpm;
            const lookahead = 0.1; 

            while (nextNoteTime < audioCtx.currentTime + lookahead) {
                
                // Logic for "Resting"
                // Every 16 beats (4 bars), roll a dice to see if we take a break
                if (beatCount % 16 === 0) {
                    // 30% chance to go silent for the next phrase
                    isResting = Math.random() < 0.3;
                }

                if (!isResting) {
                    // Standard Beat Pattern
                    if (beatCount % 2 === 0) {
                        playSound(55, 'sine', 0.8, 0.3); // Low A
                    } else {
                        playSound(110, 'sine', 0.4, 0.15); // A2
                    }

                    // Occasional Chime (Every 4 beats)
                    if (beatCount % 4 === 0) {
                        playSound(440, 'sine', 1.5, 0.05); 
                    }
                } else {
                    // Occasionally play a very sparse, high ping during rest
                    // to verify system is still alive
                    if (beatCount % 8 === 0) {
                        playSound(880, 'sine', 0.1, 0.02);
                    }
                }

                nextNoteTime += secondsPerBeat;
                beatCount++;
            }
        }

        // --- Geometry Builders ---
        function createStyledMesh(geometry, finalPos, finalRot, parentGroup) {
            const mesh = new THREE.Mesh(geometry, materialFace);
            const edges = new THREE.EdgesGeometry(geometry, 15);
            const line = new THREE.LineSegments(edges, materialLine);
            mesh.add(line);

            // Set Position/Rot
            if(finalPos) mesh.position.copy(finalPos);
            if(finalRot) mesh.rotation.set(finalRot.x, finalRot.y, finalRot.z);

            if(parentGroup) parentGroup.add(mesh);
            return mesh;
        }

        function createAssemblyPart(geometry, finalPos, finalRot, parentGroup) {
            const mesh = createStyledMesh(geometry, finalPos, finalRot, parentGroup);

            // Debris Logic for Assembly Parts
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos((Math.random() * 2) - 1);
            const r = 30 + Math.random() * CONFIG.scatterRadius;
            
            const startPos = new THREE.Vector3(
                r * Math.sin(phi) * Math.cos(theta),
                r * Math.sin(phi) * Math.sin(theta),
                r * Math.cos(phi)
            );

            const startRot = new THREE.Euler(
                Math.random() * Math.PI * 2,
                Math.random() * Math.PI * 2,
                Math.random() * Math.PI * 2
            );

            const partData = {
                mesh: mesh,
                startPos: startPos,
                destPos: finalPos.clone(),
                startRot: startRot,
                destRot: finalRot.clone(),
                speedOffset: 0.8 + Math.random() * 0.4, 
                delay: Math.random() * 0.2
            };

            parts.push(partData);
            return mesh;
        }

        function createGear(radius, width, teeth) {
            const gearGroup = new THREE.Group();
            
            const disc = new THREE.CylinderGeometry(radius, radius, width, 24);
            createAssemblyPart(disc, new THREE.Vector3(0,0,0), new THREE.Euler(0,0,0), gearGroup);
            
            const toothGeo = new THREE.BoxGeometry(width * 0.6, width, radius * 0.4);
            for(let i=0; i<teeth; i++) {
                const angle = (i / teeth) * Math.PI * 2;
                const tx = Math.cos(angle) * (radius);
                const tz = Math.sin(angle) * (radius);
                
                const pos = new THREE.Vector3(tx, 0, tz);
                const rot = new THREE.Euler(0, -angle, 0);
                createAssemblyPart(toothGeo, pos, rot, gearGroup);
            }
            return gearGroup;
        }

        // --- Background Crates Logic ---
        function initBackgroundCrates() {
            // Create 8 potential piles
            for(let i=0; i<8; i++) {
                createCratePile();
            }
        }

        function createCratePile() {
            const pileGroup = new THREE.Group();
            const boxGeo = new THREE.BoxGeometry(4, 4, 4);

            // Stack a few boxes randomly
            const numBoxes = 3 + Math.floor(Math.random() * 4);
            for(let j=0; j<numBoxes; j++) {
                const x = (Math.random() - 0.5) * 3;
                const z = (Math.random() - 0.5) * 3;
                const y = j * 4;
                createStyledMesh(boxGeo, new THREE.Vector3(x,y,z), new THREE.Euler(0, Math.random(), 0), pileGroup);
            }
            
            bgGroup.add(pileGroup);
            
            // Randomly position in the distance
            setRandomPilePosition(pileGroup);

            // Initial state: Hidden
            pileGroup.scale.set(0,0,0);

            cratePiles.push({
                group: pileGroup,
                state: 'waiting', // waiting, appearing, visible, disappearing
                timer: Math.random() * 500 // random start offset
            });
        }

        function setRandomPilePosition(group) {
            const angle = Math.random() * Math.PI * 2;
            const dist = 50 + Math.random() * 40; // Far away
            group.position.set(
                Math.cos(angle) * dist, 
                (Math.random() - 0.5) * 40, 
                Math.sin(angle) * dist
            );
            group.rotation.y = Math.random() * Math.PI;
        }

        function updateBackground() {
            cratePiles.forEach(pile => {
                pile.timer--;

                if (pile.state === 'waiting') {
                    if (pile.timer <= 0) {
                        pile.state = 'appearing';
                        setRandomPilePosition(pile.group); // Move before appearing
                    }
                } 
                else if (pile.state === 'appearing') {
                    // Grow Y scale
                    pile.group.scale.y += 0.02;
                    pile.group.scale.x = 1;
                    pile.group.scale.z = 1;

                    if (pile.group.scale.y >= 1) {
                        pile.group.scale.y = 1;
                        pile.state = 'visible';
                        pile.timer = 200 + Math.random() * 300; // Stay visible for a while
                    }
                }
                else if (pile.state === 'visible') {
                    if (pile.timer <= 0) {
                        pile.state = 'disappearing';
                    }
                }
                else if (pile.state === 'disappearing') {
                    pile.group.scale.y -= 0.02;
                    if (pile.group.scale.y <= 0) {
                        pile.group.scale.y = 0;
                        pile.state = 'waiting';
                        pile.timer = 100 + Math.random() * 400; // Wait before next spawn
                    }
                }
            });
        }

        // --- Bird System ---
        function createBirds() {
            const birdGeo = new THREE.ConeGeometry(0.3, 1.0, 4); 
            birdGeo.rotateX(Math.PI / 2); 

            for (let i = 0; i < 6; i++) {
                const mesh = createStyledMesh(birdGeo, null, null, birdGroup);
                
                const direction = Math.random() > 0.5 ? 1 : -1;

                birds.push({
                    mesh: mesh,
                    angle: (i / 6) * Math.PI * 2, 
                    speed: (0.005 + Math.random() * 0.008) * direction, 
                    heightY: 5 + (Math.random() * 20),
                    radiusOffset: Math.random() * 5,
                    direction: direction
                });
            }
        }

        function updateBirds() {
            const baseRadius = 15;
            const scatterRadius = 80;
            const currentRadiusBase = scatterRadius - ((scatterRadius - baseRadius) * smoothScroll);

            birds.forEach(b => {
                b.angle += b.speed;
                const r = currentRadiusBase + b.radiusOffset;
                const x = Math.cos(b.angle) * r;
                const z = Math.sin(b.angle) * r;
                const y = b.heightY + Math.sin(b.angle * 3) * 2; 

                b.mesh.position.set(x, y, z);
                
                let facingRot = -b.angle;
                if (b.direction < 0) facingRot += Math.PI;

                b.mesh.rotation.y = facingRot;
                b.mesh.rotation.z = b.direction * -0.2; 
            });
        }

        // --- Machine Logic ---
        function buildMachine() {
            const axleGeo = new THREE.CylinderGeometry(0.5, 0.5, 30, 12);
            const mainAxle = new THREE.Group();
            createAssemblyPart(axleGeo, new THREE.Vector3(0,0,0), new THREE.Euler(0,0,Math.PI/2), mainAxle);
            machineGroup.add(mainAxle);

            const gear1 = createGear(5, 1, 12);
            gear1.position.set(-8, 0, 0);
            gear1.rotation.x = Math.PI / 2;
            gear1.userData.spinAxis = 'x';
            gear1.userData.spinSpeed = 0.01;
            machineGroup.add(gear1);

            const gear2 = createGear(2.5, 2, 8);
            gear2.position.set(-4, 0, 0);
            gear2.rotation.x = Math.PI / 2;
            gear2.userData.spinAxis = 'x';
            gear2.userData.spinSpeed = 0.01;
            machineGroup.add(gear2);

            const gear3 = createGear(7, 0.5, 24);
            gear3.position.set(0, 0, 0);
            gear3.rotation.x = Math.PI / 2;
            gear3.userData.spinAxis = 'x';
            gear3.userData.spinSpeed = 0.01;
            machineGroup.add(gear3);

            const vertAxle = new THREE.Group();
            machineGroup.add(vertAxle);
            createAssemblyPart(new THREE.CylinderGeometry(0.4, 0.4, 15, 8), new THREE.Vector3(5, 5, 0), new THREE.Euler(0,0,0), vertAxle);

            const gear4 = createGear(5, 1, 16);
            gear4.position.set(5, 0, 0); 
            gear4.rotation.z = 0.2;
            gear4.userData.spinAxis = 'y';
            gear4.userData.spinSpeed = -0.015;
            machineGroup.add(gear4);

            const gear5 = createGear(3, 3, 10);
            gear5.position.set(5, 10, 0);
            gear5.userData.spinAxis = 'y';
            gear5.userData.spinSpeed = -0.015;
            machineGroup.add(gear5);

            const frameGeo = new THREE.BoxGeometry(1, 20, 1);
            const beamGeo = new THREE.BoxGeometry(20, 1, 1);
            const frameGroup = new THREE.Group();
            machineGroup.add(frameGroup);

            createAssemblyPart(frameGeo, new THREE.Vector3(-12, 0, -8), new THREE.Euler(0,0,0), frameGroup);
            createAssemblyPart(frameGeo, new THREE.Vector3(12, 0, -8), new THREE.Euler(0,0,0), frameGroup);
            createAssemblyPart(frameGeo, new THREE.Vector3(-12, 0, 8), new THREE.Euler(0,0,0), frameGroup);
            createAssemblyPart(frameGeo, new THREE.Vector3(12, 0, 8), new THREE.Euler(0,0,0), frameGroup);

            createAssemblyPart(beamGeo, new THREE.Vector3(0, 10, -8), new THREE.Euler(0,0,0), frameGroup);
            createAssemblyPart(beamGeo, new THREE.Vector3(0, -10, -8), new THREE.Euler(0,0,0), frameGroup);
            createAssemblyPart(beamGeo, new THREE.Vector3(0, 10, 8), new THREE.Euler(0,0,0), frameGroup);
            
            const zBeamGeo = new THREE.BoxGeometry(1, 1, 16);
            createAssemblyPart(zBeamGeo, new THREE.Vector3(-12, 10, 0), new THREE.Euler(0,0,0), frameGroup);
            createAssemblyPart(zBeamGeo, new THREE.Vector3(12, 10, 0), new THREE.Euler(0,0,0), frameGroup);

            const nutGeo = new THREE.CylinderGeometry(0.3, 0.3, 0.2, 6);
            for(let i=0; i<30; i++) {
                const pos = new THREE.Vector3(
                    (Math.random()-0.5)*20,
                    (Math.random()-0.5)*20,
                    (Math.random()-0.5)*10
                );
                createAssemblyPart(nutGeo, pos, new THREE.Euler(Math.random(), Math.random(), 0), machineGroup);
            }
        }

        // --- Interaction ---
        function onScroll() {
            const h = document.documentElement.scrollHeight - window.innerHeight;
            const t = window.scrollY / h;
            scrollPercent = Math.max(0, Math.min(1, t));
        }

        function onWindowResize() {
            const aspect = window.innerWidth / window.innerHeight;
            camera.left = -CONFIG.orthoSize * aspect;
            camera.right = CONFIG.orthoSize * aspect;
            camera.top = CONFIG.orthoSize;
            camera.bottom = -CONFIG.orthoSize;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- Animation Loop ---
        function animate() {
            requestAnimationFrame(animate);

            smoothScroll += (scrollPercent - smoothScroll) * CONFIG.scrollSensitivity;
            isAssembled = smoothScroll > 0.99;

            scheduleAudio();

            parts.forEach(p => {
                let progress = (smoothScroll - p.delay) * (1 / (1 - p.delay));
                progress = Math.max(0, Math.min(1, progress));
                const ease = 1 - Math.pow(1 - progress, 3);
                p.mesh.position.lerpVectors(p.startPos, p.destPos, ease);
                p.mesh.rotation.x = p.startRot.x + (p.destRot.x - p.startRot.x) * ease;
                p.mesh.rotation.y = p.startRot.y + (p.destRot.y - p.startRot.y) * ease;
                p.mesh.rotation.z = p.startRot.z + (p.destRot.z - p.startRot.z) * ease;
            });

            updateBirds();
            updateBackground(); // New crates animation

            if (isAssembled) {
                machineGroup.traverse((obj) => {
                    if (obj.userData && obj.userData.spinSpeed) {
                        const axis = obj.userData.spinAxis || 'x';
                        obj.rotation[axis] += obj.userData.spinSpeed;
                    }
                });
            }

            const time = Date.now() * 0.0005;
            camera.position.x = 40 + Math.sin(time) * 2;
            camera.position.z = 40 + Math.cos(time) * 2;
            camera.lookAt(0,0,0);

            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
